# Render blueprint for the ROSE backend.
#
# The backend is dependency-free, so there is no build step and no install step.
# Deploy it as a Web Service, not a Static Site: it is a long-running HTTP
# server, and Render only routes traffic to a bound port.
#
# Set the secrets in the Render dashboard (Environment → Secret Files /
# Environment Variables). Do not put them here — this file is committed.
#
#   OPENROUTER_API_KEY   required  — at least one provider credential
#   ROSE_BACKEND_TOKEN   required  — otherwise the endpoint is an open relay
#   ALLOWED_ORIGINS      optional  — default `*` is correct for an extension
#
# Additional providers are optional. Each is enabled by supplying its credential
# variable; an unset (or blank) variable simply removes it from the routing
# chain. Cloudflare also needs CLOUDFLARE_ACCOUNT_ID for the base URL.
#
#   GEMINI_API_KEY, GROQ_API_KEY, CEREBRAS_API_KEY, MISTRAL_API_KEY,
#   NVIDIA_API_KEY, CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#
# Model roles are configurable per deployment:
#   ROSE_ROLE_PRIMARY / ROSE_ROLE_FAST / ROSE_ROLE_COMPLEX / ROSE_ROLE_TRANSLATION
#   ROSE_FALLBACK_ORDER  (comma-separated provider ids)

services:
  - type: web
    name: rose-ia-backend
    runtime: node
    plan: free
    buildCommand: '' # no dependencies to install
    startCommand: node backend/rose-backend.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      # Render injects PORT and RENDER; the backend detects RENDER and binds
      # 0.0.0.0. Setting HOST explicitly is harmless and makes it obvious.
      - key: HOST
        value: 0.0.0.0
      # Secrets are declared without values so Render prompts for them rather
      # than committing anything here.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ROSE_BACKEND_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '*'
      # Optional providers — declared so Render surfaces them in the dashboard.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      # Role → provider assignment. Defaults match the code.
      - key: ROSE_ROLE_PRIMARY
        value: openrouter
      - key: ROSE_ROLE_FAST
        value: groq
      - key: ROSE_ROLE_COMPLEX
        value: cerebras
      - key: ROSE_ROLE_TRANSLATION
        value: mistral
